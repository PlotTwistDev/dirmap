[package]
name = "filescape"
version = "0.2.0"
edition = "2024"

[dependencies]
arboard = "3.6"
bytemuck = { version = "1.25.2", features = ["derive"] }
bzip2 = "0.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Filescape licensing: licence types, certificates and activation rules shared with the server.
filescape-licence = { path = "licensing/core" }
data-encoding = "2"
ring = "0.17"
serde_json = "1"
eframe = { version = "0.36.2", features = ["glow", "persistence"] }
flate2 = "1"
half = "2"
# zstd for SPZ v4 splat scenes (pure Rust; MIT).
ruzstd = "0.9"
# Gaussian splat rendering on the graphics chip (MIT or Apache-2.0); pinned, the API moves.
wgpu-3dgs-viewer = "=0.8.0"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp", "exr", "hdr", "tga", "ico", "qoi", "pnm"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
lzma-rust2 = "0.25.0"
notify = "8"
pulldown-cmark = { version = "0.13", default-features = false }
rayon = "1.12.0"
regex = "1"
rfd = "0.17.2"
roxmltree = "0.21"
ron = "0.12"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["bzip2", "ppmd", "deflate", "util"] }
sha2 = "0.11.1"
suppaftp = { version = "13", default-features = false, features = ["rustls-ring", "deprecated"] }
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "lzma", "xz", "bzip2", "ppmd"] }
resvg = "0.50"
syntect = { version = "5", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
ab_glyph = "0.2"
ttf-parser = "0.25"
lofty = "0.25.5"
kamadak-exif = "0.6"
calamine = { version = "0.38", features = ["dates"] }
hayro = "0.9.0"
# Runs GGUF models on this computer for Ask AI (llama.cpp, MIT). No OpenMP, so nothing extra ships.
llama-cpp-2 = { version = "=0.1.161", default-features = false }
# The raw bindings, for what the wrapper doesn't offer: reading each layer's output (the Lab).
llama-cpp-sys-2 = { version = "=0.1.161", default-features = false }
jxl-oxide = { version = "0.12.6", features = ["image"] }
midly = "0.5"
rusqlite = { version = "0.43.0", features = ["bundled", "hooks"] }
csv = "1.4.0"
encoding_rs = "0.8"
exr = "1.74"
gltf = { version = "1.4", default-features = false, features = ["import", "utils"] }
hayro-jpeg2000 = { version = "0.5", default-features = false, features = ["std", "simd"] }
jpeg-decoder = "0.3"
pure_jpegls = "2.1"
plist = "1"
# Reads the Craft Apps' own documents (PhotoCraft, VectorCraft, EffectCraft): saved pictures,
# pages and layers. From craft-libs (MIT or Apache-2.0), pinned to a tested commit: not on crates.io.
craft-doc = { git = "https://github.com/storytold/craft-libs", rev = "3b09a644a560ca526dfd0c7d8a1d107cdde26324" }
# After Effects projects (.aep, .aepx): a clean-room reader with no dependencies of its own.
craft-aep = { git = "https://github.com/storytold/craft-libs", rev = "3b09a644a560ca526dfd0c7d8a1d107cdde26324" }
# 12-bit and arithmetic-coded JPEGs, which the usual decoder can't read (no dependencies of its own).
craft-jpeg = { git = "https://github.com/storytold/craft-libs", rev = "3b09a644a560ca526dfd0c7d8a1d107cdde26324" }
# Photoshop layers (names, groups, text, smart objects), read-only.
craft-psd = { git = "https://github.com/storytold/craft-libs", rev = "3b09a644a560ca526dfd0c7d8a1d107cdde26324" }
# GIMP (.xcf) and Paint.NET (.pdn) layers, drawn into a picture. Read-only.
craft-xcf = { git = "https://github.com/storytold/craft-libs", rev = "3b09a644a560ca526dfd0c7d8a1d107cdde26324" }
# FBX, COLLADA and Alembic models (the formats glTF, OBJ and STL readers above don't cover).
craft-mesh = { git = "https://github.com/storytold/craft-libs", rev = "3b09a644a560ca526dfd0c7d8a1d107cdde26324", default-features = false, features = ["fbx", "dae", "abc"] }
# DWG drawings, converted to DXF in a child process (with acadrust, MPL-2.0, unmodified).
craft-dwg = { git = "https://github.com/storytold/craft-libs", rev = "3b09a644a560ca526dfd0c7d8a1d107cdde26324" }
craft-pdn = { git = "https://github.com/storytold/craft-libs", rev = "3b09a644a560ca526dfd0c7d8a1d107cdde26324" }

[features]
default = []
# Test-serial mode (FILESCAPE_LICENCE_DEV=1): an in-app licence server that issues serials, for
# developers only. Never on by default and never in a release build; build.rs refuses a release
# build with it unless FILESCAPE_ALLOW_LICENCE_DEV=1. Test with `cargo test --features licence-dev`.
licence-dev = []

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Com", "Win32_NetworkManagement_WNet", "Win32_Media", "Win32_Media_Multimedia", "Win32_System_SystemInformation", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Security"] }

# Media Foundation: frames of videos playing in the preview panes (video.rs).
# Windows.Data.Pdf: the first page of a PDF when no thumbnail handler is installed.
# Win32 shell: Explorer's own right-click menu (shellmenu.rs).
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Data_Pdf", "Storage", "Storage_Streams", "Foundation", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Ole"] }
raw-window-handle = "0.6"

[target."cfg(unix)".dependencies]
libc = "0.2.190"

# Catches Objective-C exceptions from AVFoundation, which would otherwise abort the app.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
raw-window-handle = "0.6"

# File and line numbers in crash.log backtraces (no effect on speed; kept in a .pdb on Windows).
[profile.release]
debug = "line-tables-only"

# Puts the app icon (packaging/filescape.ico) into filescape.exe.
[target."cfg(windows)".build-dependencies]
winresource = "0.1"

# On Windows and Linux the engine ships as files beside the app, loaded when it starts: a build of
# the processor engine for each kind of processor, and Vulkan for graphics cards. A computer
# without Vulkan drivers (or without AVX2) still runs models, on the processor. On a Mac the
# engine is built in, with Metal.
[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "=0.1.161", default-features = false, features = ["dynamic-backends", "vulkan"] }
