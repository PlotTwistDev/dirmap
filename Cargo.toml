[package]
name = "dirmap"
version = "0.2.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
bzip2 = "0.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.36.2", features = ["glow", "persistence"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp", "exr", "hdr", "tga", "ico", "qoi", "pnm"] }
lzma-rust2 = "0.25.0"
notify = "8"
pulldown-cmark = { version = "0.13", default-features = false }
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["bzip2", "ppmd", "deflate", "util"] }
sha2 = "0.11.1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "lzma", "xz", "bzip2", "ppmd"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Com", "Win32_NetworkManagement_WNet", "Win32_Media", "Win32_Media_Multimedia"] }

[target."cfg(unix)".dependencies]
libc = "0.2.190"
