[package]
name = "dirmap"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", features = ["glow"] }
rayon = "1.12.0"
rfd = "0.17.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target."cfg(unix)".dependencies]
libc = "0.2.190"
