name: build

# Builds Filescape for Windows, Linux and macOS on every push. Pushing a tag like v0.2.0, or running
# the workflow by hand with a version filled in, also publishes the three downloads as a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version to publish as a release, e.g. v0.2.0 (leave empty to just build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      # The AI engine's Vulkan part (graphics cards on Windows and Linux) is built with the
      # Vulkan SDK. Only the build needs it: the app loads Vulkan from the graphics drivers, and
      # runs models on the processor where there are none.
      - name: Vulkan SDK (Windows, Linux)
        if: runner.os != 'macOS'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.313.0
          cache: true

      # Visual Studio's own build files can't build the Vulkan part's shader generator; Ninja,
      # with the compiler set up for it, can.
      - name: Ninja and the compiler for CMake (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Use Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja --no-progress -y
          Add-Content $env:GITHUB_ENV "CMAKE_GENERATOR=Ninja"

      # llama-cpp-sys-2 copies its libraries to a folder it works out from Cargo's build folder,
      # which newer Cargo puts a level deeper: make sure that folder exists. (Filescape's own
      # build script puts the libraries where they're needed.)
      - name: Folders for the AI engine's build
        shell: bash
        run: mkdir -p target/release/build/deps target/debug/build/deps

      - name: Test
        run: cargo test --release

      - name: Test licensing in the app (with test mode, which release builds refuse)
        if: runner.os == 'Linux'
        run: cargo test --features licence-dev licence

      - name: Test licence core
        run: cargo test --release --manifest-path licensing/core/Cargo.toml

      - name: Test licence server
        if: runner.os == 'Linux'
        run: cargo test --release --manifest-path licensing/worker/Cargo.toml

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory dist, dist/Filescape | Out-Null
          Copy-Item target/release/filescape.exe dist/Filescape/Filescape.exe
          Copy-Item README.md dist/Filescape/
          # The AI engine, beside the program: llama.cpp, and a processor build for each kind of
          # processor plus Vulkan, which Filescape loads when it starts.
          Copy-Item target/release/*.dll dist/Filescape/
          if (-not (Test-Path dist/Filescape/ggml-vulkan.dll)) { throw "no Vulkan engine" }
          Get-ChildItem dist/Filescape | Format-Table Name, Length
          Compress-Archive -Path dist/Filescape -DestinationPath dist/Filescape-${{ matrix.name }}.zip
          Remove-Item -Recurse dist/Filescape

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          # The build for sale must never contain the test-serial mode.
          if grep -q FILESCAPE_LICENCE_DEV target/release/filescape; then echo "test mode in release build" >&2; exit 1; fi
          # The AI engine's libraries: llama.cpp, a processor build for each kind of x86 processor,
          # and Vulkan. Debug information stripped: crash.log only needs the program's own.
          # (build.rs put them beside the program.)
          mkdir engine
          find target/release -maxdepth 1 -type f \( -name 'libllama.so.0' -o -name 'libggml*.so.0' -o -name 'libggml-*.so' \) -exec cp {} engine/ \;
          strip --strip-unneeded engine/*
          test -f engine/libggml-vulkan.so && ls -l engine
          # AppImage, .deb, .rpm and the plain .tar.gz. Built on 22.04 so they run on glibc 2.35+.
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm desktop-file-utils
          packaging/linux/package.sh target/release/filescape dist engine
          # The packages must install and start their program.
          sudo apt-get install -y -qq ./dist/Filescape-linux.deb
          filescape --help
          ldd /usr/bin/filescape | tee /dev/stderr | grep -q 'lib/filescape/libllama.so'
          rpm -qpl dist/Filescape-linux.rpm | grep -qx /usr/bin/filescape
          ./dist/Filescape-linux.AppImage --appimage-extract-and-run --help

      - name: Build (macOS app bundle, Apple silicon + Intel)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          app=dist/Filescape.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          cp packaging/filescape.icns "$app/Resources/"
          lipo -create -output "$app/MacOS/filescape" \
            target/aarch64-apple-darwin/release/filescape target/x86_64-apple-darwin/release/filescape
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          sed "s/VERSION/$version/" packaging/Info.plist > "$app/Info.plist"
          # Ad-hoc signature: required to run on Apple silicon at all. Not notarized.
          codesign --force --deep --sign - dist/Filescape.app
          # A disk image with the app and a shortcut to Applications, to drag it across.
          mkdir dist/dmg
          cp -R dist/Filescape.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          # An explicit size: hdiutil's own estimate from -srcfolder is sometimes too small, and
          # the copy then fails with "No space left on device".
          mb=$(( $(du -sm dist/dmg | cut -f1) + 64 ))
          hdiutil create -volname Filescape -srcfolder dist/dmg -size ${mb}m -ov -format UDZO dist/Filescape-${{ matrix.name }}.dmg
          rm -rf dist/dmg dist/Filescape.app

      - uses: actions/upload-artifact@v4
        with:
          name: Filescape-${{ matrix.name }}
          path: dist/Filescape-${{ matrix.name }}.*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          name: Filescape ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/Filescape-${{ matrix.name }}.*

  # The manual as a website. The checks that keep it accurate (links, images, settings,
  # shortcuts, filter examples) run as part of `cargo test` above; this makes sure mdBook can
  # build it too and keeps a copy of the site with each run.
  docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Build the manual
        run: mdbook build docs

      - uses: dtolnay/rust-toolchain@stable

      - name: Third-party licence notices are up to date
        run: python3 packaging/licences.py --check

      - uses: actions/upload-artifact@v4
        with:
          name: filescape-manual
          path: docs/book
