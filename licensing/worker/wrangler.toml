# Filescape licence server. See SETUP.md for the one-time setup.
name = "filescape-licence"
main = "build/index.js"
compatibility_date = "2025-09-01"
# Keep variables set in the Cloudflare dashboard that aren't in this file (ACCESS_AUD, below).
keep_vars = true

# One Worker, three hostnames (Cloudflare creates the DNS records and certificates).
# Must sit above the [[d1_databases]] table, or TOML reads it as part of that table.
routes = [
  { pattern = "api.filescape.app", custom_domain = true },
  { pattern = "account.filescape.app", custom_domain = true },
  { pattern = "admin.filescape.app", custom_domain = true },
]

[build]
command = "sh build.sh"

[[d1_databases]]
binding = "DB"
database_name = "filescape-licences"
# Filled in from `wrangler d1 create filescape-licences` (SETUP.md step 2).
database_id = "b01b063e-a888-42f5-b762-0a9641673844"
migrations_dir = "migrations"

[vars]
# "live" (the Filescape product is on the live account); "sandbox" for a Paddle sandbox account.
PADDLE_ENV = "live"
# Comma-separated Paddle price IDs that issue a Filescape licence (pri_...).
PADDLE_PRICE_IDS = "pri_01m86kecyaqrsp7d702v4hc679,pri_01m86kf4h9r8tj5p6rtgez78v6,pri_01m84qwgg1a8858drzqk2rvzpz"
MAIL_FROM = "Filescape <licences@filescape.app>"
MAIL_REPLY_TO = "support@filescape.app"
# Cloudflare Access: your team domain (e.g. filescape.cloudflareaccess.com) and the admin
# application's Audience (AUD) tag. Until both are set the admin site refuses everyone.
ACCESS_TEAM_DOMAIN = "late-river-d752.cloudflareaccess.com"
# ACCESS_AUD is deliberately not listed here: `wrangler deploy` replaces the Worker's variables
# with this file's, so an empty value here blanked the dashboard's on every deploy. Set it once
# with `wrangler secret put ACCESS_AUD` (secrets survive deploys; the Worker reads either).

# Secrets (wrangler secret put NAME), never in this file:
#   SIGNING_KEY, SERIAL_KEY            from `cargo run --example keygen`
#   PADDLE_WEBHOOK_SECRET, PADDLE_API_KEY   from Paddle
#   RESEND_API_KEY                     from Resend

[observability]
enabled = true
