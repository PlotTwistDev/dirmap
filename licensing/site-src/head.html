<title>Filescape</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Filescape maps every file on your drive as a tile you can zoom through, with a full file manager, remote servers and VFX sequence tools built in. Windows, macOS and Linux.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one quiet near-black column; the live treemap is the only loud object on the page. */
:root {
  --void: #040506;      /* page canvas */
  --ink: #07080a;       /* cards, panels */
  --obsidian: #111214;  /* wells, pressed */
  --line: rgba(255,255,255,.07);
  --line-strong: rgba(255,255,255,.12);
  --text: #ffffff;
  --text-2: #b4b5b6;    /* body copy */
  --text-3: #7c7d7e;    /* captions */
  --key: #e6e6e6;       /* light key buttons */
  --key-text: #111214;
  --coral: #ff6363;     /* the one accent */
  --ember: #2a1617;     /* coral-tinted surface */
  --sky: #63a1ff;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --max: 1160px;
  --radius: 12px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--void); }
body { background: var(--void); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: var(--max); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--mono); }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
h2 { font-size: clamp(28px, 4vw, 44px); line-height: 1.1; letter-spacing: -.022em; font-weight: 500; }
h3 { font-size: 18px; line-height: 1.3; letter-spacing: -.01em; font-weight: 500; }
p { margin: 0; }
.lede { color: var(--text-2); font-size: 18px; max-width: 60ch; }

/* Nav */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--void); }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding-block: 14px; }
.nav-bar { display: flex; align-items: center; gap: 24px; padding: 8px 8px 8px 16px; border: 1px solid var(--line); border-radius: 14px; background: rgba(7,8,10,.72); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; text-decoration: none; letter-spacing: -.01em; }
.brand svg { width: 20px; height: 20px; }
.nav-links { display: flex; gap: 22px; margin-left: auto; font-size: 14px; color: var(--text-2); }
.nav-links a { text-decoration: none; }
.nav-links a:hover { color: var(--text); }

/* Buttons: light keys on dark, Raycast style */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; font: 500 14px/1 var(--font); text-decoration: none; cursor: pointer; border: 0; white-space: nowrap; transition: transform .15s ease, background .15s ease; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn-key { background: var(--key); color: var(--key-text); box-shadow: inset 0 -2px 0 rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.7); }
.btn-key:hover { background: #fff; }
.btn-key:active { transform: translateY(1px); }
.btn-ghost { background: var(--obsidian); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong), inset 0 1px 0 rgba(255,255,255,.04); }
.btn-ghost:hover { background: #17181a; }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 8px; }

/* Hero */
.hero { position: relative; padding-block: 72px 40px; text-align: center; }
.hero-glow { position: absolute; inset: -80px 0 auto; height: 720px; pointer-events: none; z-index: -1; overflow: hidden; }
.hero-glow::before, .hero-glow::after { content: ""; position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45; }
.hero-glow::before { width: 520px; height: 360px; left: calc(50% - 460px); top: 260px; background: radial-gradient(closest-side, rgba(255,99,99,.55), transparent); }
.hero-glow::after { width: 520px; height: 360px; left: calc(50% - 40px); top: 300px; background: radial-gradient(closest-side, rgba(99,161,255,.45), transparent); }
.hero .eyebrow { display: inline-flex; gap: 8px; align-items: center; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--ink); }
.hero .eyebrow b { color: var(--coral); font-weight: 500; }
.hero h1 { margin-top: 24px; font-size: clamp(40px, 7vw, 76px); line-height: 1.02; letter-spacing: -.035em; font-weight: 600; }
.hero .lede { margin: 20px auto 0; text-align: center; }
.dl-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 32px; }
.dl-meta { margin-top: 14px; font-family: var(--mono); font-size: 12px; color: var(--text-3); display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.dl-meta span + span::before { content: "|"; margin-right: 10px; opacity: .5; }

/* The app window around the live map */
.window { margin-top: 56px; border-radius: 14px; background: var(--ink); border: 1px solid var(--line-strong); box-shadow: 0 40px 120px -20px rgba(0,0,0,.9), 0 0 0 1px #000, inset 0 1px 0 rgba(255,255,255,.05); overflow: hidden; text-align: left; }
.win-bar { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12px; color: var(--text-3); min-width: 0; }
.dots { display: flex; gap: 6px; flex: none; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: #2a2b2d; }
.crumbs { display: flex; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.crumbs button { all: unset; cursor: pointer; color: var(--text-2); }
.crumbs button:hover { color: var(--text); }
.crumbs button[aria-current] { color: var(--text); cursor: default; }
.crumbs .sep { opacity: .4; }
.win-actions { margin-left: auto; display: flex; gap: 6px; flex: none; }
.chip { font-family: var(--mono); font-size: 11px; padding: 4px 8px; border-radius: 6px; background: var(--obsidian); color: var(--text-2); border: 1px solid var(--line); cursor: pointer; }
.chip:hover { color: var(--text); }
.chip[aria-pressed="true"] { color: var(--text); border-color: rgba(255,99,99,.5); background: var(--ember); }
.map-wrap { position: relative; aspect-ratio: 16 / 8; max-width: 100%; background: #000; }
.map-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: zoom-in; touch-action: manipulation; }
.win-foot { display: flex; gap: 16px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12px; color: var(--text-3); min-width: 0; }
.readout { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); flex: 1; }
.hint { flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 12px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 2px; }

/* Facts strip */
.facts { display: grid; grid-template-columns: repeat(4, 1fr); border-block: 1px solid var(--line); margin-top: 72px; }
.fact { padding: 24px 20px; display: grid; gap: 4px; }
.fact + .fact { border-left: 1px solid var(--line); }
.fact b { font-size: 28px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.fact span { font-size: 13px; color: var(--text-3); }

/* Sections */
section { padding-block: 112px 0; }
.section-head { display: grid; gap: 16px; max-width: 720px; }
.showcase { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; align-items: center; margin-top: 64px; }
.showcase.flip { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); }
.showcase.flip .copy { order: 2; }
.copy { display: grid; gap: 14px; min-width: 0; }
.copy p { color: var(--text-2); }
.ticks { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 8px; font-size: 14px; color: var(--text-2); }
.ticks li { display: flex; gap: 10px; }
.ticks li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: 8px; border-radius: 2px; background: var(--coral); }
.shot { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line-strong); box-shadow: 0 30px 80px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.05); background: var(--ink); }
.shot img { width: 100%; height: auto; aspect-ratio: 1280 / 820; }

/* Keyboard-key cards */
.keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 56px; }
.keycard { padding: 22px; border-radius: var(--radius); background: linear-gradient(180deg, #0c0d0f, #08090a); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), inset 0 -3px 0 rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.02); display: grid; gap: 10px; align-content: start; min-width: 0; }
.keycard .kbd { justify-self: start; font-family: var(--mono); font-size: 11px; color: var(--text-2); padding: 3px 7px; border-radius: 6px; background: var(--obsidian); border: 1px solid var(--line-strong); box-shadow: inset 0 -2px 0 rgba(0,0,0,.6); }
.keycard p { color: var(--text-2); font-size: 14px; }

/* VFX listing */
.vfx { margin-top: 56px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--ink); overflow: hidden; }
.vfx-scroll { overflow-x: auto; }
.vfx table { width: 100%; min-width: 640px; border-collapse: collapse; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.vfx th { text-align: left; font-weight: 400; color: var(--text-3); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.vfx td { padding: 11px 16px; border-bottom: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
.vfx tr:last-child td { border-bottom: 0; }
.vfx td:first-child { color: var(--text); }
.vfx .num { text-align: right; }
.vfx .miss { color: var(--coral); }
.vfx-cap { padding: 12px 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--text-3); }

/* Pricing */
.plans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 56px; max-width: 880px; }
.plan { padding: 28px; border-radius: 16px; border: 1px solid var(--line); background: var(--ink); display: grid; gap: 18px; align-content: start; min-width: 0; }
.plan.pro { background: linear-gradient(180deg, var(--ember), var(--ink) 55%); border-color: rgba(255,99,99,.28); box-shadow: inset 0 1px 0 rgba(255,140,140,.12); }
.price { display: flex; align-items: baseline; gap: 8px; }
.price b { font-size: 48px; font-weight: 600; letter-spacing: -.03em; }
.price span { color: var(--text-3); font-size: 14px; }
.price s, .js-list { color: var(--text-3); font-weight: 400; }
.price s { font-size: 24px; }
.plan ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 9px; font-size: 14px; color: var(--text-2); }
.plan li { display: flex; gap: 10px; }
.plan li::before { content: ""; flex: none; width: 12px; height: 7px; margin-top: 6px; border-left: 1.5px solid var(--text-3); border-bottom: 1.5px solid var(--text-3); transform: rotate(-45deg); }
.plan.pro li::before { border-color: var(--coral); }
.plan .btn { width: 100%; }
.small { font-size: 12px; color: var(--text-3); }
.checkout-note { font-size: 13px; color: var(--text-2); font-family: var(--mono); }

/* Requirements + FAQ */
.reqs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 48px; }
.req { padding: 20px; border-radius: var(--radius); border: 1px solid var(--line); display: grid; gap: 8px; align-content: start; }
.req p { font-size: 14px; color: var(--text-2); }
.req .btn { justify-self: start; margin-top: 6px; }
.faq { margin-top: 40px; display: grid; gap: 0; max-width: 820px; border-top: 1px solid var(--line); }
.faq details { border-bottom: 1px solid var(--line); padding-block: 18px; }
.faq summary { cursor: pointer; font-weight: 500; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font-family: var(--mono); color: var(--text-3); }
.faq details[open] summary::after { content: "–"; }
.faq p { margin-top: 10px; color: var(--text-2); font-size: 15px; max-width: 65ch; }

footer { margin-top: 120px; border-top: 1px solid var(--line); padding-block: 32px 48px; }
.foot { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center; font-size: 13px; color: var(--text-3); }
.foot a { text-decoration: none; }
.foot a:hover { color: var(--text); }
.foot .ver { margin-left: auto; font-family: var(--mono); font-size: 11px; }

@media (max-width: 900px) {
  .showcase, .showcase.flip { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .showcase.flip .copy { order: 0; }
  .keys { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .facts { grid-template-columns: repeat(2, 1fr); }
  .fact:nth-child(3) { border-left: 0; }
  .fact:nth-child(n+3) { border-top: 1px solid var(--line); }
  .reqs { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .nav-links { display: none; }
  .nav-bar .btn { margin-left: auto; }
  .hero { padding-block: 48px 24px; }
  .hero .eyebrow { font-size: 10px; letter-spacing: .05em; }
  .dl-row { flex-direction: column; align-items: stretch; max-width: 320px; margin-inline: auto; }
  .map-wrap { aspect-ratio: 4 / 5; }
  .hint { display: none; }
  .keys, .plans { grid-template-columns: minmax(0, 1fr); }
  .fact b { font-size: 22px; }
  section { padding-block: 80px 0; }
  .foot .ver { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>
